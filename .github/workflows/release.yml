name: Package and release

# Pushing a tag (for example v2.0.1) builds the zip and uploads it to GitHub, CurseForge and Wago.
# Needed once: repository secrets CF_API_KEY (CurseForge API token) and WAGO_API_TOKEN (optional),
# and the CurseForge project id in the .toc as  ## X-Curse-Project-ID: 12345

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
